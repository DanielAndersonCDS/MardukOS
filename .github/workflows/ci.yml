name: MardukOS build and boot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-boot:
    name: Build kernel and verify serial boot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run the same automatic setup used by Codespaces
        run: bash .devcontainer/setup.sh
